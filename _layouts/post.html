---
layout: default
---

<article class="post-article">
  {% if page.image %}
  <img
    src="{{ page.image | relative_url }}"
    alt=""
    class="post-article__hero-image"
  />
  {% endif %}
  <header class="post-article__header">
    <p class="post-article__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    </p>
    <h1 class="post-article__title">{% include math-text.html text=page.title %}</h1>
  </header>
  <div class="post-article__body prose">
    {{ content }}
  </div>
  <p class="post-article__back">
    {% if page.collection == 'projects' %}
    <a href="{{ '/projects/' | relative_url }}">&larr; Back to projects</a>
    {% elsif page.collection == 'news_entries' %}
    <a href="{{ '/news/' | relative_url }}">&larr; Back to news</a>
    {% endif %}
  </p>
</article>
