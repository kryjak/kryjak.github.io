  - date: 2025-02-23
    title: "Attended [EA Global: Bay Area 2025](https://www.effectivealtruism.org/ea-global/events/ea-global-bay-area-2025) in Oakland, California"
    excerpt: "My first EAG. A hugely positive experience. Talks, workshops and 1-1 meetings on a multitude of topics such as AI Safety, effective charitable giving or animal welfare."
    tags: [conference]

  - date: 2025-02-15
    title: "Started [AI Safety Poland](https://aisafety.org.pl/en) with 3 co-organisers"
    excerpt: "We started a Polish community for researchers, practitioners and enthusiasts of AI Safety (and security). To be absolutely transparent, the community (and an older website) did exist before, but it was largely dormant and fragmented. Beginning in February 2025, we initiated a concentrated and ongoing effort to grow the AI Safety capacity and awareness in our country. We run webinars, a reading club, local meetups and a dedicated Slack. I also run 1-1 career consultations for people interested in working on AI Safety. AISPL is available for comments/interviews with journalists."
    tags: [other]

  - date: 2025-01-06
    title: "Started MATS in Berkeley, California"
    excerpt: "Worked on a compute governance project under the supervision of Janet Egan from the Centre for New American Security. Did the extension phase in London, UK, until September."
    tags: [course]

  - date: 2024-12-20
    title: "Completed BlueDot's [Biosecurity Fundamentals](https://bluedot.org/courses/biosecurity)"
    excerpt: "Very interesting course. For my project, I built a simple [web app](https://github.com/kryjak/covid19_analysis_hub) that lets users explore correlations between various epidemiological signals, as well as perform basic epidemiological forecasts."
    tags: [course]

  - date: 2024-10-20
    title: "Completed the introductory [course on s-risks](https://centerforreducingsuffering.org/s-risk-fellowship/) from the Centre for Reducing Suffering"
    excerpt: "A 6-week course introducing the idea of s-risks in contexts like AI, stable totalitarianism or digital minds. Through Tobias Baumann's book [Avoiding the Worst](https://centerforreducingsuffering.org/books/avoiding-the-worst-how-to-prevent-a-moral-catastrophe-by-tobias-baumann/), I also started reading about things like multi-agent cooperation, spitefulness, the Dark Triad and better political systems."
    tags: [course]

  - date: 2024-10-03
    title: "Attended [ML4Good](https://ml4good.org/), a 10-day bootcamp on AI Safety in Germany"
    excerpt: "A very good overview of AI Safety, strategy and basic ML aspects, held in a small village in the German countryside. Met some cool people and still keep in touch/collaborate with some of them."
    tags: [course]

  - date: 2024-09-10
    title: "Completed BlueDot's [AI Safety Fundamentals](https://bluedot.org/courses/alignment)"
    excerpt: "Completed the 8-week (part-time) Technical Alignment course + a 4-week [project](https://bluedot.org/courses/alignment) in which I deliberately fine-tuned an LLM to be sycophantic and looked at how this trades off with truthfulness."
    tags: [course]

  - date: 2024-07-01
    title: "Started [Pivotal Fellowship](https://www.pivotal-research.org/fellowship) in London, UK"
    excerpt: "Worked on understanding jailbreaks through the vision modality, and their lack of transferability between VLMs." 
    tags: [course]

  - date: 2024-02-01
    title: "Started [Faculty Fellowship](https://faculty.ai/fellowship-fellows) in London, UK"
    excerpt: "Worked on input-space jailbreaks on vision-language models." 
    tags: [course]

