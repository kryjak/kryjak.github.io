    excerpt: "Previously called 'AI for Animals'. Particular highlights were Adrià Moret's talk about his paper [AI Welfare Risks](https://link.springer.com/article/10.1007/s11098-025-02343-7), as well as listening to Jeff Sebo [speak](https://www.youtube.com/watch?v=39VVdwdtuYE) for 30 minutes from memory and without stuttering once."
