  - date: 2025-03-01
    title: "Attended the [AI for Animals](https://forum.effectivealtruism.org/posts/KWpyRXzHn6JMyZiBn/ai-for-animals-2025-bay-area-retrospective) conference in Berkeley, California."
    excerpt: "A two-day conference covering topics such as animal welfare, digital minds, consciousness, precision livestock farming, ethics and advocacy. Very interesting, would recommend."
