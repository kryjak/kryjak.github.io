  - date: 2026-05-16
    title: "Two papers accepted to the [Technical AI Governance Workshop](https://taigr-workshop.com/) at ICML 2026"
    excerpt: "Co-authored two papers: 'Fingerprinting All AI Cluster I/O Without Mutually Trusted Processors' (which started as an [Apart hackathon](https://apartresearch.com/project/fingerprinting-all-ai-cluster-io-without-mutually-trusted-processors-d81l) weekend project) and 'Exploring Systems-Thinking Approaches to Loss of Control Risk' (which was the output of one of the [SPAR projects](https://sparai.org/projects/sp26/?search=jakub) I was supervising). Thanks to all collaborators!"
    tags: [paper]

  - date: 2026-03-23
    title: "Published a blogpost [On theoretical physics, AI and human creativity](https://jakubkrys.substack.com/p/on-theoretical-physics-ai-and-human)"
    excerpt: "TLDR: OpenAI released a paper claiming GPT-5.2 derived a result in theoretical physics. By sheer coincidence, the subject of this paper is literally what I did my PhD on. I was impressed with GPT-5.2 and frustrated with the extremely poor level of public discourse around this paper, so I wrote a thorough blogpost about it. I was later told that people enjoyed it and found it useful for calibrating their views on AI capabilities in frontier maths/physics research."
    tags: [blogpost]

  - date: 2026-05-13
    title: "Attended an informal one-day 'unconference' on AI Verification in Oxford, UK"
    excerpt: "Discussed open problems in verification, software and hardware aspects, most pressing directions, strategies for popularising AI Verification research and even red-teaming the whole agenda."
    tags: [conference]

  - date: 2026-05-01
    title: "Gave a [talk](https://luma.com/inside-saferai) for an online event organised by BlueDot Impact"
    excerpt: "A 20-minute online talk covering the risk modelling agenda at SaferAI, as well as the bottlenecks and open questions."
    tags: [talk]

  - date: 2026-03-24
    title: "Gave a talk on behalf of AI Safety Poland as part of a [WAIT meetup](https://www.meetup.com/wait-wroclaw-ai-team/events/313616903/?eventOrigin=group_past_events) in Wrocław, Poland"
    excerpt: "Gave a talk about AI Safety, compute governance, AI regulation, the semiconductor supply chain and geopolitics. About 160 people in attendance. WAIT (Wrocław AI Team) is a community of AI/Data Science researchers, practitioners and enthusiasts."
    tags: [talk]

  - date: 2026-03-16
    title: "Attended the AIxBio Symposium in Cambridge, UK"
    excerpt: "One-day conference organised by the [Cambridge Biosecurity Hub](https://www.cambiohub.org/), in collaboration with the ERA Fellowship. Very interesting (and concerning) talks about latest capabilities of LLMs in bio and wetlab contexts."
    tags: [conference]

  - date: 2026-03-14
    title: "Taught one day of the [Orion AI Governance Initiative](https://www.orionaigov.org/)"
    excerpt: "Orion is a talent development scheme for students interested in working on AI policy/governance, with a focus on AI Safety. Gave a talk about compute governance."
    tags: [talk, teaching]

  - date: 2026-03-03
    title: "[AI Safety Poland](https://aisafety.org.pl/en) was [awarded](https://substack.com/home/post/p-194227385) USD 4800 by BlueDot Impact"
    excerpt: "We received funding through the Rapid Grants programme to organise a series of 4 in-person events in Warsaw, Poznań, Kraków and Wrocław. Thanks to BlueDot for enabling this and thanks to Jakub Nowak for taking care of the application!"
    tags: [other]

  - date: 2026-03-02
    title: "Attended the [Alignment Workshop](https://www.far.ai/events/event-list/london-alignment-workshop-2026) in London, UK"
    excerpt: "Two-day conference organised by FAR AI."
    tags: [conference]

  - date: 2026-02-15
    title: "Started supervising 3 [SPAR projects](https://sparai.org/projects/sp26/?search=jakub) at SaferAI"
    excerpt: "Projects are on: (1) improving risk modelling methodology, (2) LLM forecasters and (3) applying ideas from systems thinking/safety engineering to AI-driven Loss of Control scenarios."
    tags: [teaching, other]

  - date: 2025-12-12
    title: "Presented a poster at the [AI and Societal Robustness Conference](https://www.ukaiforum.com/ai-and-societal-robustness-conference-2025) in Cambridge, UK"
    excerpt: "Poster based on the paper [Toward Quantitative Modeling of Cybersecurity Risks Due to AI Misuse](https://arxiv.org/abs/2512.08864). One-day conference at Jesus College about cybersec, def/acc, AIxBio, evaluations and many other topics surrounding the theme of 'how to prepare our society for advanced AI'."
    tags: [poster]

  - date: 2025-12-09
    title: "Contributed to the paper [Toward Quantitative Modeling of Cybersecurity Risks Due to AI Misuse](https://arxiv.org/abs/2512.08864) at SaferAI."
    excerpt: "Paper on risk modelling cyber misuse using Bayesian Networks and expert elicitation."
    tags: [paper]

  - date: 2025-11-19
    title: "Published my [project on hash collisions](https://jakubkrys.substack.com/p/reusable-md5-collisions-on-pickles) from the [AI Security Bootcamp](https://aisb.dev/2025)"
    excerpt: "This project won 2nd prize at the bootcamp. TLDR: if you give me any two `.pickle` files, I can make their MD5 hashes collide. I also explain why this doesn't work for `.safetensors`. One of the nerdiest and most enjoyable projects I've ever done, and definitely the most low-level. Not sure about its practical usefulness, though, as nobody uses MD5 anymore (and nobody should be using `.pickle` files!)."
    tags: [blogpost]

  - date: 2025-10-23
    title: "Gave an [Introduction to AI Safety](https://luma.com/gslraobm?tk=3mU0WT) online talk for AI Safety Poland"
    excerpt: "This talk kicked off our biweekly webinar series of which I am the organiser and host. I encourage you to subscribe to our [Luma calendar](https://luma.com/aisafetypl) for news of webinars and more."
    tags: [talk]

  - date: 2025-09-22
    title: "Started as a Research Scientist at [SaferAI](https://www.safer-ai.org/)"
    excerpt: "Focus on risk modelling of AI-enabled cyber misuse and Loss of Control scenarios. Based at [LISA](https://www.safeai.org.uk/), London."
    tags: [other]

  - date: 2025-08-31
    title: "Attended the first edition of the [AI Security Bootcamp](https://aisb.dev/2025) in London, UK"
    excerpt: "A month-long bootcamp on various topics in IT and AI security, e.g.: networking, pentesting, cryptography, Docker security, reverse engineering, cloud security, jailbreaks, prompt injections, membership inference attacks, weight extraction attacks. All of it was super interesting, but also quite hard to follow for me, as it was at a high pace and for people that have more security-relevant background than me. In any case, I enjoyed it very much. Thanks to the organisers! Teaching materials can be found [here](https://github.com/pranavgade20/aisb). *Addendum: my [project on hash collisions](https://jakubkrys.substack.com/p/reusable-md5-collisions-on-pickles) won 2nd prize at the bootcamp.*"
    tags: [course]

  - date: 2025-08-17
    title: "Presented a poster at the [Technical AI Governance Forum](https://www.techgov.ai/) in London, UK"
    excerpt: "Poster based on my [MATS project](https://arxiv.org/abs/2507.07765). A two-day conference on various issues in technical governance, including agentic oversight, compute governance, evaluations, geopolitics, cybersecurity, verification and forecasting."
    tags: [conference, poster]

  - date: 2025-08-02
    title: "Published a policy piece [Internal Warnings, Public Stakes: Strengthening AI Whistleblower Protections in the EU](https://aiwhistleblowerinitiative.substack.com/p/internal-warnings-public-stakes-strengthening)"
    excerpt: "A piece in which I look into the EU Whistleblowing Directive, analyse where it falls short in the context of AI, stress the importance of whistleblowing for upholding AI regulation, and sketch a path forward. Written and published with the generous support of Karl Koch and the AI Whistleblower Initiative."
    tags: [blogpost]

  - date: 2025-07-19
    title: "Attended ICML 2025 in Vancouver, Canada, and gave an oral presentation at the [Technical AI Governance Workshop](https://icml.cc/virtual/2025/workshop/39964)"
    excerpt: "Talk based on ['Distributed and Decentralised Training: Technical Governance Challenges in a Shifting AI Landscape'](https://arxiv.org/abs/2507.07765). Also attended the accompanying [Post-AGI Civilizational Equilibria](https://www.post-agi.org/vancouver25) workshop."
    tags: [conference, poster, talk]

  - date: 2025-07-10
    title: "Published first-author paper ['Distributed and Decentralised Training: Technical Governance Challenges in a Shifting AI Landscape'](https://arxiv.org/abs/2507.07765)"
    excerpt: "Main output of my MATS project, later accepted as an oral presentation to the [Technical AI Governance Workshop](https://icml.cc/virtual/2025/workshop/39964) at ICML 2025. This is a very policy-oriented document; I also have a much longer and more technical version. Email me if interested."
    tags: [paper]

