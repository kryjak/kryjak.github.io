- date: 2025-11-19
  title: "Reusable MD5 collisions on `.pickle` files`"
  description: "My project from the [AI Security Bootcamp](https://aisb.dev/2025), which won 2nd prize. TLDR: if you give me any two `.pickle` files, I can make their MD5 hashes collide. I also explain why this doesn't work for `.safetensors`. One of the nerdiest and most enjoyable projects I've ever done, and definitely the most low-level. Not sure about its practical usefulness, though, as nobody uses MD5 anymore (and nobody should be using `.pickle` files!)."
  url: https://jakubkrys.substack.com/p/reusable-md5-collisions-on-pickles

- date: 2025-08-02
  title: "Internal Warnings, Public Stakes: Strengthening AI Whistleblower Protections in the EU"
  description: "I look into the EU Whistleblowing Directive, analyse where it falls short in the context of AI, stress the importance of whistleblowing for upholding AI regulation, and sketch a path forward. Written and published with the generous support of Karl Koch and the AI Whistleblower Initiative."
  url: https://aiwhistleblowerinitiative.substack.com/p/internal-warnings-public-stakes-strengthening

- date: 2024-12-20
  title: "Covid-19 Analysis Hub"
  description: "My BlueDot [Biosecurity Fundamentals](https://bluedot.org/courses/biosecurity) project, a simple web app that pulls Covid-19 epidemiological data from the Delphi group at CMU and lets users explore correlations between different signals, as well as forecasts."
  url: https://github.com/kryjak/covid19_analysis_hub

